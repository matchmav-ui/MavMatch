<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MavMatch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; max-width: 400px; margin: 50px auto;">

  <!-- TEMPORARY DEV TOOLBAR (Remove before final submission) -->
  <div style="background: #eee; padding: 8px; margin-bottom: 20px; text-align: center; font-size: 12px;">
    <strong>Dev View Switcher:</strong><br>
    <button onclick="showSection('auth-section')">Auth</button>
    <button onclick="showSection('profile-section')">Profile</button>
    <button onclick="showSection('swipe-section')">Swipe</button>
  </div>

  <!-- AUTH SECTION (Your Work) -->
  <div id="auth-section">
    <h2>MavMatch Sign Up</h2>
    <input type="email" id="email" placeholder="student@mavs.uta.edu" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;" />
    <input type="password" id="password" placeholder="Password" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;" />
    
    <button onclick="handleSignUp()" style="width: 100%; padding: 10px; background: #0064B1; color: white; border: none; cursor: pointer; box-sizing: border-box;">
      Sign Up
    </button>

    <p id="statusMessage" style="margin-top: 15px; color: red;"></p>
  </div>

  <!-- PROFILE SECTION (Teammate A) -->
  <div id="profile-section" style="display: none;">
    <h2>Setup Your Profile</h2>
    <!-- Teammate A writes profile HTML form here -->
  </div>

  <!-- SWIPE SECTION (Teammate B) -->
  <div id="swipe-section" style="display: none;">
    <h2>Find Matches</h2>
    <!-- Teammate B writes swipe card UI here -->
  </div>

  <!-- SCRIPT IMPORTS -->
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="swipe.js"></script>
</body>
</html>
